name: Verify public research resources
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_release.py
      - run: python scripts/reproduce_results.py
      - run: python scripts/run_method.py
      - run: python scripts/run_method.py --method cost_greedy
